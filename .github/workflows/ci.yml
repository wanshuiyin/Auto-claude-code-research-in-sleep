name: CI

on:
  pull_request:
    branches:
      - aris-code
      - main
  push:
    branches:
      - aris-code
      - main

# Cancel in-progress runs for the same PR/branch when new commits land.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Minimum viable gate: ensures aris-code branch + every PR can build
  # and pass the regression test suite that protects v0.4.x fixes.
  #
  # Intentionally NOT included yet (tracked in follow-up tickets):
  #   - cargo fmt --check         (pre-existing fmt inconsistencies; needs single cleanup PR first)
  #   - cargo clippy -D warnings  (pre-existing pedantic warnings; tighten incrementally)
  #   - macos cargo test          (one pre-existing macos-specific failure in tools::repl_executes_python_code)
  test:
    name: cargo build + test (ubuntu)
    runs-on: ubuntu-22.04

    steps:
      # v0.4.12 v0.4.11-followup: fetch-depth: 0 so the
      # `skills_source_commit_pin_present_and_well_formed` drift test
      # can do the optional ancestor check against `origin/main`.
      # Default shallow checkout makes that check silently skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main for SKILLS_SOURCE_COMMIT ancestor check
        run: git fetch --no-tags origin main:refs/remotes/origin/main
        continue-on-error: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ubuntu-cargo-

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

      - name: cargo test (workspace, serial)
        # --test-threads=1 prevents cwd race conditions in tests that spawn
        # subprocesses (e.g. tools::web_search_*, subagent_runtime_*) which
        # share process-global cwd on ubuntu runners.
        run: cargo test --workspace -- --test-threads=1

  build-macos:
    name: cargo build (macos)
    runs-on: macos-latest

    steps:
      # v0.4.12 v0.4.11-followup: fetch-depth: 0 mirrors the ubuntu job
      # so the drift test ancestor check has full git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main for SKILLS_SOURCE_COMMIT ancestor check
        run: git fetch --no-tags origin main:refs/remotes/origin/main
        continue-on-error: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-cargo-

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

  # v0.4.22: Windows compile gate for the new cfg(windows) branches
  # (C4 PKCE getrandom, C5 where.exe command probing, C6 codex
  # classification), plus the three Windows-relevant targeted test groups.
  #
  # Intentionally NOT the full test suite on Windows: the rest of the
  # workspace tests carry un-audited Unix assumptions (login-shell PATH
  # semantics, /dev/* paths, unix permissions). Only the targeted groups
  # below run, each with a non-zero-executed guard so a typo'd test-name
  # filter can never produce a silent 0-test green.
  windows:
    name: cargo build + targeted tests (windows)
    runs-on: windows-latest

    steps:
      # fetch-depth: 0 mirrors the ubuntu/macos jobs so any drift-test
      # ancestor check has full git history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main for SKILLS_SOURCE_COMMIT ancestor check
        run: git fetch --no-tags origin main:refs/remotes/origin/main
        continue-on-error: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: cargo build (workspace)
        run: cargo build --workspace --all-targets

      # GitHub's built-in `shell: bash` runs with `-eo pipefail`, so a
      # cargo test failure fails the step through the tee pipe, and the
      # grep guard fails the step when the name filter executed 0 tests.
      - name: cargo test (windows-targeted, PKCE / C4)
        shell: bash
        run: |
          cargo test -p runtime --lib pkce_token -- --test-threads=1 2>&1 | tee pkce_token.log
          # Non-zero-executed guard: require "test result: ok." with >=1 passed.
          grep -E "test result: ok\. [1-9][0-9]* passed" pkce_token.log

      - name: cargo test (windows-targeted, tools probe / C5)
        shell: bash
        run: |
          cargo test -p tools --lib command_exists_probe -- --test-threads=1 2>&1 | tee command_exists_probe.log
          # Non-zero-executed guard: require "test result: ok." with >=1 passed.
          grep -E "test result: ok\. [1-9][0-9]* passed" command_exists_probe.log

      - name: cargo test (windows-targeted, codex classifier / C6)
        shell: bash
        run: |
          cargo test -p aris-cli --bin aris classify_codex -- --test-threads=1 2>&1 | tee classify_codex.log
          # Non-zero-executed guard: require "test result: ok." with >=1 passed.
          grep -E "test result: ok\. [1-9][0-9]* passed" classify_codex.log
